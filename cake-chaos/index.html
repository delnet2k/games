<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF6EC">
<title>Cake Chaos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FFF6EC;
    --surface:#FFFFFF;
    --surface-2:#FFEBD6;
    --surface-3:#FFF1DF;
    --text:#4A2E1F;
    --text-muted:#8A6652;
    --accent-pearl:#E8779D;
    --accent-pearl-ink:#9C3F5D;
    --accent-phoebe:#8E5BA6;
    --accent-phoebe-ink:#5B3A6E;
    --gold:#D98F1F;
    --gold-soft:#F3C878;
    --danger:#D1573C;
    --border:#EBD9C2;
    --btn-ink:#FFFFFF;
    --shadow: 0 10px 24px -14px rgba(74,46,31,0.35);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#221510;
      --surface:#32221A;
      --surface-2:#3C291E;
      --surface-3:#3C291E;
      --text:#F5E6D8;
      --text-muted:#C9A98C;
      --accent-pearl:#F2A0BC;
      --accent-pearl-ink:#FBD7E3;
      --accent-phoebe:#C095D6;
      --accent-phoebe-ink:#ECDCF5;
      --gold:#F0BE5E;
      --gold-soft:#5A4322;
      --danger:#EE8468;
      --border:#4A382C;
      --btn-ink:#2A1430;
      --shadow: 0 10px 26px -12px rgba(0,0,0,0.55);
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#221510;
    --surface:#32221A;
    --surface-2:#3C291E;
    --surface-3:#3C291E;
    --text:#F5E6D8;
    --text-muted:#C9A98C;
    --accent-pearl:#F2A0BC;
    --accent-pearl-ink:#FBD7E3;
    --accent-phoebe:#C095D6;
    --accent-phoebe-ink:#ECDCF5;
    --gold:#F0BE5E;
    --gold-soft:#5A4322;
    --danger:#EE8468;
    --border:#4A382C;
    --btn-ink:#2A1430;
    --shadow: 0 10px 26px -12px rgba(0,0,0,0.55);
    color-scheme: dark;
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Nunito',system-ui,sans-serif;
    padding-inline:16px;
    padding-block:20px 40px;
    -webkit-text-size-adjust:100%;
  }
  h1,h2,h3,.display{
    font-family:'Fredoka',system-ui,sans-serif;
    text-wrap:balance;
  }
  button{
    font-family:inherit;
    touch-action:manipulation;
    -webkit-tap-highlight-color:transparent;
    -webkit-user-select:none;user-select:none;
  }

  .app{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:18px;}

  /* ---- topbar ---- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:12px 16px;
    box-shadow:var(--shadow);
  }
  .brand{display:flex;align-items:center;gap:10px;}
  .avatars{display:flex;}
  .avatars svg{margin-right:-10px;filter:drop-shadow(0 3px 4px rgba(0,0,0,0.15));}
  .brand-text{display:flex;flex-direction:column;line-height:1.15;margin-left:6px;}
  .brand-text .by{font-size:12px;color:var(--text-muted);font-weight:700;letter-spacing:.04em;text-transform:uppercase;}
  .brand-text .title{font-family:'Fredoka',system-ui,sans-serif;font-weight:700;font-size:21px;}
  .stats{display:flex;align-items:center;gap:14px;flex-wrap:wrap;}
  .stat{
    display:flex;align-items:center;gap:6px;
    font-weight:800;font-variant-numeric:tabular-nums;
    background:var(--surface-2);border-radius:999px;padding:6px 12px;font-size:14px;
    white-space:nowrap;
  }
  .stat .dim{color:var(--text-muted);font-weight:700;font-size:12px;text-transform:uppercase;letter-spacing:.03em;}
  .hearts{display:flex;gap:3px;}
  .hearts svg{width:18px;height:18px;}

  /* ---- intro / tip strip ---- */
  .tip{
    font-size:14px;color:var(--text-muted);
    line-height:1.4;
  }

  /* ---- counter / slots ---- */
  .counter{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(190px,1fr));
    gap:14px;
  }
  .slot{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:18px;
    padding:14px;
    display:flex;flex-direction:column;gap:10px;
    min-height:260px;
    min-width:0;
    box-shadow:var(--shadow);
    position:relative;
    overflow:hidden;
  }
  .slot.rush{border-color:var(--gold);box-shadow:0 0 0 2px var(--gold-soft), var(--shadow);}
  .slot.empty{
    align-items:center;justify-content:center;
    color:var(--text-muted);
    min-height:260px;
    border-style:dashed;
    text-align:center;
  }
  .empty-stand{width:56px;height:56px;opacity:.55;}
  .empty-label{font-size:13px;margin-top:8px;font-weight:700;}

  .ticket{
    display:flex;align-items:center;gap:10px;
    background:var(--surface-2);
    border-radius:12px;
    padding:8px 10px;
  }
  .ticket .swatch{
    width:26px;height:26px;border-radius:50%;flex:none;
    border:2px solid rgba(0,0,0,0.12);
  }
  .ticket .names{display:flex;flex-direction:column;line-height:1.2;min-width:0;}
  .ticket .flavor-name{font-weight:800;font-size:13px;}
  .ticket .topping-name{font-size:12px;color:var(--text-muted);font-weight:700;display:flex;align-items:center;gap:4px;}
  .ticket .rush-tag{
    margin-left:auto;font-size:10px;font-weight:800;
    background:var(--gold);color:#3A2600;border-radius:999px;padding:2px 7px;
    text-transform:uppercase;letter-spacing:.03em;
  }

  .bar-track{
    height:9px;border-radius:999px;background:var(--surface-3);
    overflow:hidden;border:1px solid var(--border);
  }
  .bar-fill{height:100%;border-radius:999px;transition:width .12s linear, background-color .3s;}
  .bar-fill.patience{background:var(--gold);}
  .bar-fill.patience.warn{background:var(--danger);}
  .bar-fill.bake{background:var(--accent-phoebe);}

  .bar-label{font-size:11px;color:var(--text-muted);font-weight:700;text-transform:uppercase;letter-spacing:.03em;}

  .stage-visual{
    flex:1;
    display:flex;align-items:center;justify-content:center;
    font-size:40px;
    min-height:64px;
    border-radius:12px;
    background:var(--surface-2);
    position:relative;
  }
  .stage-visual .pulse{animation:pulse 1.1s ease-in-out infinite;}
  @keyframes pulse{0%,100%{transform:scale(1);}50%{transform:scale(1.08);}}

  .cake-art{width:56px;height:56px;}

  .toppings-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;}
  .topping-btn{
    display:flex;align-items:center;justify-content:center;gap:5px;
    border:1.5px solid var(--border);
    background:var(--surface);
    color:var(--text);
    border-radius:10px;
    padding:8px 6px;
    min-height:44px;
    min-width:0;
    font-weight:700;font-size:12px;
    line-height:1.15;text-align:center;
    cursor:pointer;
  }
  @media (hover:hover){ .topping-btn:hover{border-color:var(--accent-phoebe);} }
  .topping-btn:active{background:var(--surface-2);}
  .topping-btn:focus-visible{outline:2px solid var(--accent-phoebe);outline-offset:2px;}

  .primary-btn{
    border:none;border-radius:12px;
    padding:10px 14px;min-height:44px;font-weight:800;font-size:14px;
    cursor:pointer;color:var(--btn-ink);
    background:var(--accent-phoebe);
    box-shadow:0 4px 0 var(--accent-phoebe-ink);
    transition:transform .05s;
  }
  .primary-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--accent-phoebe-ink);}
  .primary-btn.gold{background:var(--gold);box-shadow:0 4px 0 #8a5a0f;color:#3A2600;}
  .primary-btn:disabled{opacity:.5;cursor:not-allowed;}
  .primary-btn:focus-visible{outline:2px solid var(--text);outline-offset:2px;}

  .shake{animation:shake .32s;}
  @keyframes shake{
    10%,90%{transform:translateX(-2px);}
    20%,80%{transform:translateX(3px);}
    30%,50%,70%{transform:translateX(-5px);}
    40%,60%{transform:translateX(5px);}
  }

  .float-toast{
    position:absolute;top:6px;left:50%;transform:translateX(-50%);
    font-weight:800;font-size:15px;pointer-events:none;white-space:nowrap;
    animation:floatUp 1s ease-out forwards;
    z-index:3;
  }
  .float-toast.good{color:var(--gold);}
  .float-toast.bad{color:var(--danger);}
  @keyframes floatUp{
    0%{opacity:0;transform:translate(-50%,6px);}
    20%{opacity:1;}
    100%{opacity:0;transform:translate(-50%,-26px);}
  }

  .pop-in{animation:popIn .22s ease-out;}
  @keyframes popIn{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}

  /* ---- overlay / modal ---- */
  .overlay{
    position:fixed;inset:0;
    background:rgba(34,21,16,0.55);
    display:flex;align-items:center;justify-content:center;
    padding:max(16px, env(safe-area-inset-top, 0px)) 16px max(16px, env(safe-area-inset-bottom, 0px));
    z-index:10;
  }
  .overlay[hidden]{
    display:none;
  }
  .modal{
    background:var(--surface);
    border:1px solid var(--border);
    border-radius:20px;
    padding:24px;
    max-width:440px;width:100%;
    max-height:86vh;max-height:86dvh;overflow-y:auto;
    -webkit-overflow-scrolling:touch;overscroll-behavior:contain;
    box-shadow:var(--shadow);
  }
  .modal h2{margin:0 0 6px;font-size:24px;}
  .modal p{color:var(--text-muted);line-height:1.5;font-size:14px;}
  .modal .row-stats{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0;}
  .modal .row-stats .pill{background:var(--surface-2);border-radius:999px;padding:8px 14px;font-weight:800;font-size:13px;}

  .upgrade-card{
    display:flex;align-items:center;gap:10px;
    border:1px solid var(--border);border-radius:14px;
    padding:10px 12px;margin-bottom:10px;
  }
  .upgrade-card .icon{font-size:22px;flex:none;}
  .upgrade-card .info{flex:1;min-width:0;}
  .upgrade-card .info .name{font-weight:800;font-size:14px;}
  .upgrade-card .info .desc{font-size:12px;color:var(--text-muted);}
  .upgrade-card .levels{display:flex;gap:3px;margin-top:4px;}
  .upgrade-card .levels span{width:8px;height:8px;border-radius:50%;background:var(--border);}
  .upgrade-card .levels span.on{background:var(--accent-phoebe);}
  .buy-btn{
    border:none;border-radius:10px;padding:8px 10px;min-height:40px;font-weight:800;font-size:12px;
    background:var(--gold);color:#3A2600;cursor:pointer;white-space:nowrap;flex:none;
  }
  .buy-btn:disabled{opacity:.4;cursor:not-allowed;}

  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:16px;flex-wrap:wrap;}
  .primary-btn.plain{background:var(--surface-2);color:var(--text);box-shadow:0 4px 0 var(--border);}

  /* ---- leaderboard ---- */
  .board-btn{
    border:none;border-radius:999px;background:var(--surface-2);color:var(--text);
    font-size:16px;line-height:1;padding:6px 10px;min-height:32px;cursor:pointer;
  }
  .board-btn:focus-visible{outline:2px solid var(--accent-phoebe);outline-offset:2px;}
  .modal h3{font-family:'Fredoka',system-ui,sans-serif;font-size:18px;margin:18px 0 8px;}
  .score-form label{display:block;font-weight:800;font-size:13px;margin-bottom:6px;}
  .name-row{display:flex;gap:8px;flex-wrap:wrap;}
  .name-row input{
    flex:1 1 140px;min-width:0;
    font:inherit;font-size:16px;font-weight:700;
    color:var(--text);background:var(--surface);
    border:1.5px solid var(--border);border-radius:12px;padding:10px 12px;
  }
  .name-row input:focus{outline:2px solid var(--accent-phoebe);outline-offset:1px;border-color:var(--accent-phoebe);}
  .name-row .primary-btn{flex:none;}
  .form-msg{margin:8px 0 0;font-size:13px;font-weight:700;min-height:1.2em;color:var(--text-muted);}
  .form-msg.bad{color:var(--danger);}
  .board{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;}
  .board li{
    display:grid;grid-template-columns:2em minmax(0,1fr) auto;gap:10px;align-items:center;
    padding:7px 10px;border-radius:10px;background:var(--surface-3);
    font-weight:700;font-size:14px;font-variant-numeric:tabular-nums;
  }
  .board li .rank{color:var(--text-muted);font-weight:800;}
  .board li:nth-child(-n+3) .rank{color:var(--gold);}
  .board li .who{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .board li .who small{display:block;color:var(--text-muted);font-size:12px;font-weight:700;overflow:hidden;text-overflow:ellipsis;}
  .board li .total{font-weight:800;}
  .board li.me{background:var(--surface-2);box-shadow:inset 0 0 0 2px var(--accent-phoebe);}
  .board-empty{color:var(--text-muted);font-size:14px;margin:0;}

  footer.credit{text-align:center;font-size:12px;color:var(--text-muted);margin-top:4px;}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.001ms !important;animation-iteration-count:1 !important;transition-duration:0.001ms !important;}
  }

  /* ---- phones: two cards per row, compact header ---- */
  @media (max-width:560px){
    body{padding-block:12px 28px;}
    .app{gap:12px;}

    .topbar{padding:10px 12px;border-radius:14px;gap:10px;}
    .avatars svg{width:32px;height:32px;}
    .brand-text .by{font-size:10px;}
    .brand-text .title{font-size:18px;}
    .stats{width:100%;gap:6px;justify-content:space-between;}
    .stat{padding:5px 9px;font-size:13px;gap:4px;}
    .stat .dim{font-size:10px;}
    .hearts svg{width:16px;height:16px;}

    .tip{font-size:13px;}

    .counter{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;}
    .counter > .slot:only-child{grid-column:1 / -1;}

    .slot{padding:10px;gap:8px;min-height:230px;border-radius:14px;}
    .slot.empty{min-height:230px;}
    .empty-stand{width:44px;height:44px;}
    .empty-label{font-size:12px;}

    .ticket{padding:6px 8px;gap:7px;flex-wrap:wrap;border-radius:10px;}
    .ticket .swatch{width:20px;height:20px;}
    .ticket .flavor-name{font-size:12px;}
    .ticket .topping-name{font-size:11px;}
    .ticket .rush-tag{font-size:9px;padding:2px 6px;}

    .stage-visual{font-size:32px;min-height:56px;border-radius:10px;}
    .cake-art{width:48px;height:48px;}

    .toppings-grid{gap:5px;}
    .topping-btn{flex-direction:column;gap:2px;padding:6px 3px;font-size:11px;min-height:50px;}
    .topping-btn svg, .topping-btn span[aria-hidden]{font-size:16px;}

    .primary-btn{padding:12px 10px;font-size:15px;}

    .modal{padding:18px;border-radius:16px;}
    .modal h2{font-size:21px;}
    .modal .row-stats .pill{padding:6px 12px;}
    .modal-actions .primary-btn{width:100%;}
  }
</style>
<style>body{margin:0;padding-top:max(20px, env(safe-area-inset-top, 0px));padding-bottom:max(40px, env(safe-area-inset-bottom, 0px));}@media (max-width:560px){body{padding-top:max(12px, env(safe-area-inset-top, 0px));padding-bottom:max(28px, env(safe-area-inset-bottom, 0px));}}</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <div class="avatars">
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="22" r="15" fill="#F2C9A0"/>
          <path d="M5 20 Q6 4 20 6 Q34 4 35 20 Q30 12 20 13 Q10 12 5 20Z" fill="#E8779D"/>
          <circle cx="4" cy="24" r="4.5" fill="#E8779D"/>
          <circle cx="36" cy="24" r="4.5" fill="#E8779D"/>
          <circle cx="15" cy="23" r="1.6" fill="#4A2E1F"/>
          <circle cx="25" cy="23" r="1.6" fill="#4A2E1F"/>
          <path d="M14 29 Q20 33 26 29" stroke="#4A2E1F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M9 10 Q20 -2 31 10 Q31 4 20 4 Q9 4 9 10Z" fill="#fff" stroke="#EBD9C2" stroke-width="1"/>
        </svg>
        <svg width="40" height="40" viewBox="0 0 40 40" aria-hidden="true">
          <circle cx="20" cy="22" r="15" fill="#F2C9A0"/>
          <path d="M5 16 Q6 4 20 7 Q34 4 35 16 L33 24 Q30 11 20 13 Q10 11 7 24Z" fill="#8E5BA6"/>
          <circle cx="15" cy="23" r="1.6" fill="#4A2E1F"/>
          <circle cx="25" cy="23" r="1.6" fill="#4A2E1F"/>
          <path d="M14 29 Q20 33 26 29" stroke="#4A2E1F" stroke-width="1.6" fill="none" stroke-linecap="round"/>
          <path d="M9 10 Q20 -2 31 10 Q31 4 20 4 Q9 4 9 10Z" fill="#fff" stroke="#EBD9C2" stroke-width="1"/>
        </svg>
      </div>
      <div class="brand-text">
        <span class="by">Pearl &amp; Phoebe's</span>
        <span class="title">Cake Chaos</span>
      </div>
    </div>
    <div class="stats">
      <div class="stat"><span class="dim">Day</span> <span id="dayNum">1</span></div>
      <div class="stat"><span class="dim">Wave</span> <span id="waveNum">1</span>/<span id="waveMax">6</span></div>
      <div class="stat">🪙 <span id="coinCount">0</span></div>
      <div class="hearts" id="heartsRow" aria-label="Reputation"></div>
      <button class="board-btn" id="boardBtn" type="button" aria-label="Leaderboard" title="Leaderboard">🏆</button>
    </div>
  </header>

  <div class="tip" id="tipStrip">Tap <strong>Bake</strong> to start an order, match the <strong>topping</strong>, then <strong>Serve</strong> before patience runs out!</div>

  <main class="counter" id="counter"></main>

  <footer class="credit">Made for Pearl &amp; Phoebe · a little bakery of chaos</footer>
</div>

<div class="overlay" id="overlay" hidden>
  <div class="modal" id="modal"></div>
</div>

<script>
(function(){
  "use strict";

  var FLAVORS = [
    {id:'vanilla', name:'Vanilla', color:'#F3E0B5', bake:3000},
    {id:'strawberry', name:'Strawberry', color:'#E8879C', bake:3200},
    {id:'lemon', name:'Lemon', color:'#F0D264', bake:3400},
    {id:'chocolate', name:'Chocolate', color:'#8A5A36', bake:4000}
  ];
  var TOPPINGS = [
    {id:'sprinkles', name:'Sprinkles', dots:true},
    {id:'choc', name:'Choc Shavings', emoji:'🍫'},
    {id:'berries', name:'Berries', emoji:'🍓'},
    {id:'gold', name:'Gold Dust', emoji:'✨'}
  ];

  var MAX_SLOTS = 6;
  var MAX_HEARTS = 3;
  var HIGH_SCORE_KEY = 'cakeChaosHighScore';
  var NAME_KEY = 'cakeChaosName';

  // Shared leaderboard (Supabase). The publishable key is meant to be public:
  // the table only allows reading and adding scores.
  var BOARD_URL = 'https://ppqlwnqpimictchkpqyu.supabase.co/rest/v1/scores';
  var BOARD_KEY = 'sb_publishable_UoMfluUBvmWgHxPD3gvBaA_zxN6LudO';

  var state = null;
  var tickHandle = null;
  var slotEls = [];
  var lastStage = [];

  function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
  function clamp(v,min,max){ return Math.max(min, Math.min(max, v)); }

  var ORDERS_PER_DAY = MAX_SLOTS*(MAX_SLOTS+1)/2;

  function newState(){
    return {
      day: 1,
      coins: 0,
      hearts: MAX_HEARTS,
      slots: [],
      upgrades: { patience:0, speed:0 },
      wave: 1,
      waveResolved: 0,
      ordersResolved: 0,
      dayLost: 0,
      spawnTimer: 800,
      phase: 'intro' // intro | playing | daySummary | gameover
    };
  }

  function slotCount(){ return state.wave; }
  function patienceMax(){
    var base = Math.max(9000, 14000 - (state.day-1)*400);
    return base * (1 + state.upgrades.patience*0.22);
  }
  function bakeTimeFor(flavor){
    return flavor.bake * (1 - state.upgrades.speed*0.14);
  }
  function spawnIntervalBase(){
    return Math.max(1500, 3300 - (state.day-1)*150);
  }

  function initWaveSlots(){
    var n = slotCount();
    state.slots = [];
    for (var i=0;i<n;i++) state.slots.push(null);
    lastStage = new Array(n).fill(undefined);
  }

  function startDay(){
    state.phase = 'playing';
    state.wave = 1;
    state.waveResolved = 0;
    state.ordersResolved = 0;
    state.dayLost = 0;
    state.spawnTimer = 400;
    initWaveSlots();
    closeModal();
    renderTop();
    renderCounter(true);
    if (!tickHandle) tickHandle = setInterval(tick, 100);
  }

  function checkWaveComplete(){
    if (state.phase !== 'playing') return;
    if (state.waveResolved < state.wave) return;
    if (state.wave >= MAX_SLOTS){
      endDay();
      return;
    }
    state.wave++;
    state.waveResolved = 0;
    state.spawnTimer = 300;
    initWaveSlots();
    renderCounter(true);
    renderTop();
  }

  function makeOrder(){
    var rush = Math.random() < 0.16;
    return {
      flavor: rand(FLAVORS),
      topping: rand(TOPPINGS),
      stage: 'waiting', // waiting -> baking -> ready -> plated -> (served/lost)
      patience: patienceMax() * (rush ? 0.82 : 1),
      patienceMax: patienceMax() * (rush ? 0.82 : 1),
      bakeProgress: 0,
      bakeTime: 0,
      rush: rush,
      wrongFlash: false
    };
  }

  function tick(){
    if (state.phase !== 'playing') return;

    // spawn logic: fill any empty slot in the current wave
    state.spawnTimer -= 100;
    if (state.spawnTimer <= 0){
      var emptyIdx = state.slots.indexOf(null);
      if (emptyIdx !== -1){
        state.slots[emptyIdx] = makeOrder();
        state.spawnTimer = spawnIntervalBase() + (Math.random()*600 - 300);
        renderSlot(emptyIdx);
      } else {
        state.spawnTimer = 400;
      }
    }

    for (var i=0;i<state.slots.length;i++){
      var o = state.slots[i];
      if (!o) continue;

      if (o.stage === 'baking'){
        o.bakeProgress += 100;
        if (o.bakeProgress >= o.bakeTime){
          o.bakeProgress = o.bakeTime;
          o.stage = 'ready';
          renderSlot(i);
        } else {
          updateBakeBar(i, o);
        }
      }

      if (o.stage !== 'plated-done'){
        o.patience -= 100;
        if (o.patience <= 0 && o.stage !== 'lost'){
          loseOrder(i);
          continue;
        }
        updatePatienceBar(i, o);
      }
    }

    renderTop();
  }

  function startBake(i){
    var o = state.slots[i];
    if (!o || o.stage !== 'waiting') return;
    o.stage = 'baking';
    o.bakeTime = bakeTimeFor(o.flavor);
    o.bakeProgress = 0;
    renderSlot(i);
  }

  function chooseTopping(i, toppingId){
    var o = state.slots[i];
    if (!o || o.stage !== 'ready') return;
    if (toppingId === o.topping.id){
      o.stage = 'plated';
      renderSlot(i);
    } else {
      o.patience -= 1200;
      o.wrongFlash = true;
      renderSlot(i);
      flashToast(i, 'Oops!', 'bad');
      var card = slotEls[i];
      if (card){
        card.classList.add('shake');
        setTimeout(function(){ card.classList.remove('shake'); }, 340);
      }
    }
  }

  function serve(i){
    var o = state.slots[i];
    if (!o || o.stage !== 'plated') return;
    var frac = clamp(o.patience / o.patienceMax, 0, 1);
    var reward = Math.round((6 + frac*10) * (o.rush ? 2 : 1));
    state.coins += reward;
    flashToast(i, '+'+reward+' 🪙', 'good');
    state.ordersResolved++;
    state.waveResolved++;
    state.slots[i] = null;
    lastStage[i] = undefined;
    renderSlot(i);
    renderTop();
    checkWaveComplete();
  }

  function loseOrder(i){
    var o = state.slots[i];
    if (!o) return;
    o.stage = 'lost';
    state.hearts = Math.max(0, state.hearts - 1);
    state.ordersResolved++;
    state.dayLost++;
    state.waveResolved++;
    flashToast(i, '💔', 'bad');
    renderTop();
    var card = slotEls[i];
    if (card){
      card.classList.add('shake');
      setTimeout(function(){ card.classList.remove('shake'); }, 340);
    }
    setTimeout(function(){
      if (state.slots[i] === o){
        state.slots[i] = null;
        lastStage[i] = undefined;
        renderSlot(i);
        checkWaveComplete();
      }
    }, 650);

    if (state.hearts <= 0){
      state.phase = 'gameover';
      setTimeout(showGameOver, 500);
    }
  }

  function endDay(){
    state.phase = 'daySummary';
    showDaySummary();
  }

  function flashToast(i, text, kind){
    var card = slotEls[i];
    if (!card) return;
    var t = document.createElement('div');
    t.className = 'float-toast ' + kind;
    t.textContent = text;
    card.appendChild(t);
    setTimeout(function(){ t.remove(); }, 1000);
  }

  // ---------- rendering ----------

  function renderTop(){
    document.getElementById('dayNum').textContent = state.day;
    document.getElementById('waveNum').textContent = state.wave;
    document.getElementById('coinCount').textContent = state.coins;
    var heartsRow = document.getElementById('heartsRow');
    heartsRow.innerHTML = '';
    for (var i=0;i<MAX_HEARTS;i++){
      var filled = i < state.hearts;
      var svg = document.createElementNS('http://www.w3.org/2000/svg','svg');
      svg.setAttribute('viewBox','0 0 24 24');
      svg.innerHTML = '<path d="M12 21s-7.5-4.6-10-9.3C.3 7.9 2.3 4 6 4c2 0 3.5 1.1 4.2 2.6C10.9 5.1 12.4 4 14.4 4 18.1 4 20 7.9 18.2 11.7 16.4 16.5 12 21 12 21z" style="fill:'+(filled?'var(--danger)':'var(--border)')+'"/>';
      heartsRow.appendChild(svg);

  function cakeArtSVG(flavor, decorated, topping){
    var base = '<svg class="cake-art" viewBox="0 0 64 64">' +
      '<rect x="12" y="34" width="40" height="18" rx="4" fill="'+flavor.color+'"/>' +
      '<rect x="12" y="34" width="40" height="7" rx="3" fill="rgba(255,255,255,0.35)"/>' +
      '<rect x="16" y="24" width="32" height="12" rx="4" fill="'+flavor.color+'"/>';
    if (decorated){
      if (topping.id === 'sprinkles'){
        var dots = '';
        var cols = ['#E8779D','#D98F1F','#8E5BA6','#fff'];
        for (var k=0;k<10;k++){
          var x = 18 + (k*3)%30 + (k%2)*2;
          var y = 22 + (k%3)*3;
          dots += '<rect x="'+x+'" y="'+y+'" width="2" height="2" fill="'+cols[k%cols.length]+'" transform="rotate('+(k*37)+' '+x+' '+y+')"/>';
        }
        base += dots;
      } else {
        base += '<text x="32" y="30" font-size="14" text-anchor="middle">'+topping.emoji+'</text>';
      }
    }
    base += '<ellipse cx="32" cy="24" rx="16" ry="4" fill="'+(decorated?'#fff':flavor.color)+'" opacity="'+(decorated?0.9:0.6)+'"/>';
    base += '</svg>';
    return base;
  }

  function toppingButtonHTML(t){
    var icon = t.dots
      ? '<svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="3" cy="4" r="1.4" fill="#E8779D"/><circle cx="8" cy="3" r="1.4" fill="#D98F1F"/><circle cx="13" cy="5" r="1.4" fill="#8E5BA6"/><circle cx="5" cy="10" r="1.4" fill="#D98F1F"/><circle cx="11" cy="11" r="1.4" fill="#E8779D"/></svg>'
      : '<span aria-hidden="true">'+t.emoji+'</span>';
    return icon + '<span>'+t.name+'</span>';
  }

  function renderCounter(force){
    var counter = document.getElementById('counter');
    counter.innerHTML = '';
    slotEls = [];
    for (var i=0;i<state.slots.length;i++){
      var card = document.createElement('div');
      card.className = 'slot';
      counter.appendChild(card);
      slotEls.push(card);
      lastStage[i] = undefined;
      renderSlot(i);
    }
  }

  function renderSlot(i){
    var card = slotEls[i];
    if (!card) return;
    var o = state.slots[i];
    var stageKey = o ? o.stage : 'empty';
    if (lastStage[i] === stageKey && o && o.stage !== 'ready') {
      // still rebuild on 'ready' re-entry only when needed; otherwise skip full rebuild for perf on baking ticks (handled separately)
      if (stageKey !== 'baking') return;
      if (lastStage[i] === 'baking') return;
    }
    lastStage[i] = stageKey;

    card.classList.toggle('empty', !o);
    card.classList.toggle('rush', !!(o && o.rush));
    card.classList.add('pop-in');
    setTimeout(function(){ card.classList.remove('pop-in'); }, 240);

    if (!o){
      card.innerHTML =
        '<svg class="empty-stand" viewBox="0 0 64 64" aria-hidden="true">' +
        '<rect x="10" y="40" width="44" height="6" rx="3" fill="var(--border)"/>' +
        '<rect x="20" y="30" width="24" height="10" rx="3" fill="var(--border)"/>' +
        '<rect x="26" y="16" width="12" height="4" rx="2" fill="var(--border)"/>' +
        '</svg>' +
        '<div class="empty-label">Waiting for a customer&hellip;</div>';
      return;
    }

    var html = '';
    html += '<div class="ticket">' +
      '<div class="swatch" style="background:'+o.flavor.color+'"></div>' +
      '<div class="names">' +
        '<span class="flavor-name">'+o.flavor.name+'</span>' +
        '<span class="topping-name">' + (o.topping.dots ? '&bull; Sprinkles' : o.topping.emoji+' '+o.topping.name) + '</span>' +
      '</div>' +
      (o.rush ? '<span class="rush-tag">Rush!</span>' : '') +
      '</div>';

    html += '<div>' +
      '<div class="bar-label">Patience</div>' +
      '<div class="bar-track"><div class="bar-fill patience" id="pat-'+i+'" style="width:'+(100*o.patience/o.patienceMax)+'%"></div></div>' +
      '</div>';

    if (o.stage === 'baking'){
      html += '<div>' +
        '<div class="bar-label">Baking</div>' +
        '<div class="bar-track"><div class="bar-fill bake" id="bake-'+i+'" style="width:'+(100*o.bakeProgress/o.bakeTime)+'%"></div></div>' +
        '</div>';
    }

    var visualEmoji = '';
    if (o.stage === 'waiting') visualEmoji = cakeArtSVG(o.flavor,false,null);
    else if (o.stage === 'baking') visualEmoji = '<span class="pulse">🔥</span>';
    else if (o.stage === 'ready') visualEmoji = cakeArtSVG(o.flavor,false,null);
    else if (o.stage === 'plated') visualEmoji = cakeArtSVG(o.flavor,true,o.topping);
    else if (o.stage === 'lost') visualEmoji = '😢';

    html += '<div class="stage-visual">'+visualEmoji+'</div>';

    if (o.stage === 'waiting'){
      html += '<button class="primary-btn" data-act="bake" data-i="'+i+'">Bake</button>';
    } else if (o.stage === 'baking'){
      html += '<button class="primary-btn" disabled>Baking&hellip;</button>';
    } else if (o.stage === 'ready'){
      html += '<div class="toppings-grid">';
      TOPPINGS.forEach(function(t){
        html += '<button class="topping-btn" data-act="topping" data-i="'+i+'" data-topping="'+t.id+'">'+toppingButtonHTML(t)+'</button>';
      });
      html += '</div>';
    } else if (o.stage === 'plated'){
      html += '<button class="primary-btn gold" data-act="serve" data-i="'+i+'">Serve</button>';
    } else if (o.stage === 'lost'){
      html += '<button class="primary-btn" disabled>Gone&hellip;</button>';
    }

    card.innerHTML = html;
  }

  function updatePatienceBar(i, o){
    var el = document.getElementById('pat-'+i);
    if (!el) return;
    var pct = clamp(100*o.patience/o.patienceMax,0,100);
    el.style.width = pct+'%';
    el.classList.toggle('warn', pct < 30);
  }
  function updateBakeBar(i, o){
    var el = document.getElementById('bake-'+i);
    if (!el) return;
    el.style.width = clamp(100*o.bakeProgress/o.bakeTime,0,100)+'%';
  }

  document.getElementById('counter').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-act]');
    if (!btn) return;
    var i = parseInt(btn.getAttribute('data-i'),10);
    var act = btn.getAttribute('data-act');
    if (act === 'bake') startBake(i);
    else if (act === 'serve') serve(i);
    else if (act === 'topping') chooseTopping(i, btn.getAttribute('data-topping'));
  });

  // ---------- modals ----------

  var overlay = document.getElementById('overlay');
  var modal = document.getElementById('modal');

  function openModal(html){
    modal.innerHTML = html;
    overlay.hidden = false;
    modal.scrollTop = 0;
  }
  function closeModal(){
    overlay.hidden = true;

  function upgradeDefs(){
    return [
      {
        key:'patience', icon:'⏳', name:'Patient Regulars', max:3,
        desc:'+22% customer patience.',
        cost:[20,35,55]
      },
      {
        key:'speed', icon:'⚡', name:'Quicker Ovens', max:3,
        desc:'Cakes bake 14% faster.',
        cost:[20,35,55]
      }
    ];
  }

  function upgradeCardHTML(def){
    var level = state.upgrades[def.key];
    var maxed = level >= def.max;
    var cost = maxed ? null : def.cost[level];
    var dots = '';
    for (var k=0;k<def.max;k++) dots += '<span class="'+(k<level?'on':'')+'"></span>';
    return '<div class="upgrade-card">' +
      '<div class="icon">'+def.icon+'</div>' +
      '<div class="info">' +
        '<div class="name">'+def.name+'</div>' +
        '<div class="desc">'+def.desc+'</div>' +
        '<div class="levels">'+dots+'</div>' +
      '</div>' +
      '<button class="buy-btn" data-upgrade="'+def.key+'" '+((maxed||state.coins<cost)?'disabled':'')+'>' +
        (maxed ? 'Maxed' : ('🪙 '+cost)) +
      '</button>' +
      '</div>';
  }

  function showDaySummary(){
    var earned = state.coins;
    var html = '<h2>Day '+state.day+' done!</h2>' +
      '<p>Pearl and Phoebe wipe the flour off their hands. Time to restock before tomorrow&rsquo;s rush.</p>' +
      '<div class="row-stats">' +
        '<div class="pill">🪙 '+state.coins+' total</div>' +
        '<div class="pill">Served '+(state.ordersResolved - state.dayLost)+' / '+ORDERS_PER_DAY+'</div>' +
        (state.dayLost > 0 ? '<div class="pill">💔 '+state.dayLost+' lost today</div>' : '') +
      '</div>' +
      '<div id="upgradeList"></div>' +
      '<div class="modal-actions">' +
        '<button class="primary-btn gold" id="nextDayBtn">Open Day '+(state.day+1)+'</button>' +
      '</div>';
    openModal(html);
    renderUpgradeList();
    document.getElementById('nextDayBtn').addEventListener('click', function(){
      state.day++;
      startDay();
    });

  function renderUpgradeList(){
    var list = document.getElementById('upgradeList');
    if (!list) return;
    var defs = upgradeDefs();
    list.innerHTML = defs.map(upgradeCardHTML).join('');
    list.querySelectorAll('[data-upgrade]').forEach(function(b){
      b.addEventListener('click', function(){
        var key = b.getAttribute('data-upgrade');
        var def = defs.filter(function(d){return d.key===key;})[0];
        var level = state.upgrades[key];
        if (level >= def.max) return;
        var cost = def.cost[level];
        if (state.coins < cost) return;
        state.coins -= cost;
        state.upgrades[key]++;
        renderTop();
        renderUpgradeList();
      });
    });
  }

  function loadHighScore(){
    try {
      var raw = localStorage.getItem(HIGH_SCORE_KEY);
      return raw ? JSON.parse(raw) : {day:1, coins:0};
    } catch(e){ return {day:1, coins:0}; }
  }
  function saveHighScore(hs){
    try { localStorage.setItem(HIGH_SCORE_KEY, JSON.stringify(hs)); } catch(e){}
  }

  // ---------- leaderboard ----------

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function loadName(){
    try { return localStorage.getItem(NAME_KEY) || ''; } catch(e){ return ''; }
  }
  function saveName(n){
    try { localStorage.setItem(NAME_KEY, n); } catch(e){}
  }

  function nameKey(n){ return String(n).replace(/\s+/g,' ').trim().toLowerCase(); }

  // Every game's score, newest first, added up into one row per player.
  function fetchBoard(){
    var q = '?select=name,day,coins&game=eq.cake-chaos&order=created_at.desc&limit=1000';
    return fetch(BOARD_URL + q, {headers:{apikey:BOARD_KEY}, cache:'no-store'})
      .then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(rows){
        var byKey = {}, players = [];
        rows.forEach(function(r){
          var k = nameKey(r.name), p = byKey[k];
          if (!p){ p = byKey[k] = {key:k, name:r.name.trim(), coins:0, games:0, bestDay:0}; players.push(p); }
          p.coins += r.coins; p.games++; p.bestDay = Math.max(p.bestDay, r.day);
        });
        return players.sort(function(a,b){ return b.coins - a.coins || b.bestDay - a.bestDay || a.games - b.games; });
      });
  }
  function postScore(name, day, coins){
    return fetch(BOARD_URL, {
      method:'POST',
      headers:{apikey:BOARD_KEY, 'Content-Type':'application/json', Prefer:'return=representation'},
      body: JSON.stringify({name:name, day:day, coins:coins})
    }).then(function(r){ if (!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .then(function(rows){ return rows && rows[0]; });
  }

  // Fills #boardList with the top 10 players, highlighting player `mineKey`.
  // Resolves with that player's overall rank and totals, or null.
  function renderBoard(mineKey){
    var list = document.getElementById('boardList');
    if (!list) return Promise.resolve(null);
    list.innerHTML = '<p class="board-empty">Loading the leaderboard&hellip;</p>';
    return fetchBoard().then(function(players){
      if (!document.body.contains(list)) return null;
      if (!players.length){
        list.innerHTML = '<p class="board-empty">No scores yet. Finish a game to be first on the board!</p>';
        return null;
      }
      var mine = null;
      players.forEach(function(p, i){ if (p.key === mineKey) mine = {rank:i+1, player:p}; });
      list.innerHTML = '<ol class="board">' + players.slice(0,10).map(function(p, i){
        return '<li'+(p.key === mineKey?' class="me"':'')+'>' +
          '<span class="rank">'+(i+1)+'</span>' +
          '<span class="who">'+esc(p.name)+'<small>'+p.games+(p.games===1?' game':' games')+' &middot; best Day '+p.bestDay+'</small></span>' +
          '<span class="total">🪙 '+p.coins+'</span>' +
          '</li>';
      }).join('') + '</ol>';
      return mine;
    }).catch(function(){
      if (document.body.contains(list)){
        list.innerHTML = '<p class="board-empty">Couldn&rsquo;t load the leaderboard. Check your internet connection and try again later.</p>';
      }
      return null;
    });
  }

  function showBoard(){
    var prev = state.phase;
    if (prev === 'daySummary' || prev === 'gameover' || prev === 'board') return;
    state.phase = 'board';
    openModal(
      '<h2>Leaderboard</h2>' +
      '<p>Every baker&rsquo;s coins from all their games, added up. Top 10.</p>' +
      '<div id="boardList"></div>' +
      '<div class="modal-actions">' +
        '<button class="primary-btn gold" id="boardBackBtn">'+(prev === 'playing' ? 'Back to the bakery' : 'Close')+'</button>' +
      '</div>');
    renderBoard(0);
    document.getElementById('boardBackBtn').addEventListener('click', function(){
      if (prev === 'playing'){ state.phase = 'playing'; closeModal(); }
      else { state.phase = prev; showIntro(); }
    });
  }
  document.getElementById('boardBtn').addEventListener('click', showBoard);

  function showGameOver(){
    if (tickHandle){ clearInterval(tickHandle); tickHandle = null; }
    var hs = loadHighScore();
    var isNew = state.day > hs.day || (state.day === hs.day && state.coins > hs.coins);
    if (isNew){ hs = {day: state.day, coins: state.coins}; saveHighScore(hs); }
    var final = {day: state.day, coins: state.coins};

    var html = '<h2>The bakery closes&hellip;</h2>' +
      '<p>Reputation ran out &mdash; too many grumpy customers today. Pearl and Phoebe will reopen tomorrow.</p>' +
      '<div class="row-stats">' +
        '<div class="pill">Reached Day '+final.day+'</div>' +
        '<div class="pill">🪙 '+final.coins+'</div>' +
      '</div>' +
      (isNew ? '<p><strong>New best on this device!</strong></p>' : '<p>Best on this device: Day '+hs.day+' &middot; 🪙 '+hs.coins+'</p>') +
      '<form class="score-form" id="scoreForm" novalidate>' +
        '<label for="playerName">Add your score to the leaderboard</label>' +
        '<div class="name-row">' +
          '<input id="playerName" name="playerName" maxlength="16" autocomplete="nickname" placeholder="Your name" value="'+esc(loadName())+'">' +
          '<button class="primary-btn" type="submit" id="scoreSubmit">Add score</button>' +
        '</div>' +
        '<p class="form-msg" id="scoreMsg" role="status"></p>' +
      '</form>' +
      '<h3>Top 10</h3>' +
      '<div id="boardList"></div>' +
      '<div class="modal-actions">' +
        '<button class="primary-btn gold" id="restartBtn">Play Again</button>' +
      '</div>';
    openModal(html);
    renderBoard(0);

    var form = document.getElementById('scoreForm');
    var input = document.getElementById('playerName');
    var submit = document.getElementById('scoreSubmit');
    var msg = document.getElementById('scoreMsg');
    form.addEventListener('submit', function(e){
      e.preventDefault();
      var name = input.value.replace(/\s+/g,' ').trim().slice(0,16);
      if (!name){
        msg.className = 'form-msg bad';
        msg.textContent = 'Type your name first.';
        input.focus();
        return;
      }
      submit.disabled = true; input.disabled = true;
      msg.className = 'form-msg';
      msg.textContent = 'Adding your score…';
      saveName(name);
      postScore(name, final.day, final.coins).then(function(row){
        return renderBoard(nameKey(name)).then(function(mine){
          msg.textContent = mine
            ? ('Added! '+mine.player.name+' is number '+mine.rank+' with 🪙 '+mine.player.coins+' from '+mine.player.games+(mine.player.games===1?' game.':' games.'))
            : 'Score added.';
          submit.textContent = 'Added';
        });
      }).catch(function(){
        submit.disabled = false; input.disabled = false;
        msg.className = 'form-msg bad';
        msg.textContent = 'Couldn’t add your score. Check your internet connection and try again.';
      });
    });

    document.getElementById('restartBtn').addEventListener('click', function(){
      state = newState();
      renderTop();
      document.getElementById('counter').innerHTML = '';
      startDay();
    });
  }

  function showIntro(){
    var hs = loadHighScore();
    var html = '<h2>Welcome to Cake Chaos!</h2>' +
      '<p>Pearl and Phoebe are opening the counter. Customers queue up with an order ticket &mdash; a flavour and a topping. Tap <strong>Bake</strong>, wait for the oven, pick the matching topping, then <strong>Serve</strong> before their patience bar runs out.</p>' +
      '<p>Each day starts with just <strong>one</strong> customer. Clear them and the next wave brings <strong>two</strong> at once, then <strong>three</strong>&nbsp;&mdash; all the way up to <strong>six</strong> at a time!</p>' +
      '<p>Earn coins to buy upgrades between days. Lose 3 hearts of reputation and the bakery closes for the day.</p>' +
      (hs.day > 1 || hs.coins > 0 ? '<p>Best run: Day '+hs.day+' &middot; 🪙 '+hs.coins+'</p>' : '') +
      '<div class="modal-actions">' +
        '<button class="primary-btn plain" id="introBoardBtn">🏆 Leaderboard</button>' +
        '<button class="primary-btn gold" id="startBtn">Open the Bakery</button>' +
      '</div>';
    openModal(html);
    document.getElementById('startBtn').addEventListener('click', startDay);
    document.getElementById('introBoardBtn').addEventListener('click', showBoard);
  }

  // ---------- boot ----------

  function boot(data){
    state = newState();
    renderTop();
    showIntro();
  }

  if (window.claude && window.claude.hot && window.claude.hot.snapshot){
    window.claude.hot.snapshot(function(){ return {}; });
  }
  if (window.claude && window.claude.hot && window.claude.hot.ready){
    window.claude.hot.ready(boot);
  } else {
    boot(window.claude && window.claude.hot ? window.claude.hot.data : {});
  }
})();
</script>
</body>
</html>
